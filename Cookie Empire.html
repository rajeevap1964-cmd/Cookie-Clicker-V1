<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🍪 Cookie Empire</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #402000, #120700 70%);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* ---------------- NICKNAME ---------------- */

#nicknameScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.92);
}

.nicknameBox {
    width: min(420px, 90%);
    padding: 35px;

    background: linear-gradient(145deg,#241205,#100803);
    border: 2px solid #ff9d32;
    border-radius: 22px;

    text-align: center;
    box-shadow: 0 0 50px rgba(255,145,40,.25);
}

.nicknameBox h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.nicknameBox p {
    color: #bbb;
    margin-bottom: 25px;
}

.nicknameBox input {
    width: 100%;
    padding: 15px;

    background: #090909;
    border: 1px solid #555;
    border-radius: 12px;

    color: white;
    outline: none;
}

.nicknameBox button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(90deg,#ff7b00,#ffb300);
    color: white;
    font-weight: bold;
}

/* ---------------- HEADER ---------------- */

header {
    padding: 18px 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(0,0,0,.45);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.playerName {
    color: #ffb347;
}

/* ---------------- GAME ---------------- */

.game {
    min-height: calc(100vh - 70px);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 45px;
}

.cookieCount {
    font-size: 42px;
    font-weight: bold;
}

.cps {
    margin-top: 8px;
    color: #aaa;
}

.cookie {
    width: 250px;
    height: 250px;

    margin-top: 35px;

    border-radius: 50%;

    border: 8px solid #8b4a16;

    background:
        radial-gradient(circle at 30% 30%, #d89042, #8a4717);

    box-shadow:
        0 0 35px rgba(255,150,40,.35),
        inset 0 0 30px rgba(0,0,0,.4);

    font-size: 120px;

    transition: transform .08s;
}

.cookie:active {
    transform: scale(.92);
}

.adminOpen {
    position: fixed;
    right: 20px;
    bottom: 20px;

    padding: 12px 17px;

    border: none;
    border-radius: 12px;

    background: #241205;
    color: #ffad42;

    border: 1px solid #8b4a16;
}

/* ---------------- ADMIN LOGIN ---------------- */

.modal {
    position: fixed;
    inset: 0;

    z-index: 5000;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.85);
}

.modalBox {
    width: min(500px,92%);

    padding: 25px;

    background: #130b06;

    border: 1px solid #8b4a16;
    border-radius: 18px;
}

.modalBox h2 {
    margin-bottom: 15px;
}

.modalBox input,
.modalBox select {
    width: 100%;

    margin: 6px 0;
    padding: 11px;

    background: #080808;
    color: white;

    border: 1px solid #444;
    border-radius: 9px;
}

.adminButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;

    margin-top: 10px;
}

.adminButtons button {
    padding: 11px;

    border: none;
    border-radius: 9px;

    background: #8b4a16;
    color: white;
}

.close {
    background: #333 !important;
}

/* ---------------- ADMIN PANEL ---------------- */

#adminPanel {
    display: none;
}

.section {
    margin-top: 18px;
    padding-top: 15px;

    border-top: 1px solid #333;
}

.danger {
    background: #9d2020 !important;
}

.success {
    background: #267d3e !important;
}

/* ---------------- TOAST ---------------- */

#toast {
    position: fixed;
    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    padding: 13px 20px;

    background: #111;
    border: 1px solid #555;
    border-radius: 12px;

    display: none;

    z-index: 10000;
}
</style>
</head>

<body>

<!-- NICKNAME SCREEN -->

<div id="nicknameScreen">

    <div class="nicknameBox">

        <h1>🍪 Cookie Empire</h1>

        <p>Choose your nickname</p>

        <input
            id="nicknameInput"
            maxlength="20"
            placeholder="Nickname..."
            autocomplete="off"
        >

        <button onclick="joinGame()">
            ENTER EMPIRE
        </button>

    </div>

</div>


<!-- HEADER -->

<header>

    <div class="logo">
        🍪 Cookie Empire
    </div>

    <div>
        👤 <span id="playerName" class="playerName">Player</span>
    </div>

</header>


<!-- GAME -->

<main class="game">

    <div id="cookieCount" class="cookieCount">
        0 Cookies
    </div>

    <div id="cps" class="cps">
        0 CPS
    </div>

    <button id="cookie" class="cookie">
        🍪
    </button>

</main>


<!-- ADMIN BUTTON -->

<button class="adminOpen" onclick="openAdmin()">
    👑 Admin Abuse
</button>


<!-- ADMIN MODAL -->

<div id="adminModal" class="modal">

    <div class="modalBox">

        <!-- LOGIN -->

        <div id="adminLogin">

            <h2>👑 Admin Login</h2>

            <input
                id="adminPassword"
                type="password"
                placeholder="Admin password..."
            >

            <div class="adminButtons">

                <button onclick="adminLogin()">
                    LOGIN
                </button>

                <button class="close" onclick="closeAdmin()">
                    CLOSE
                </button>

            </div>

        </div>


        <!-- PANEL -->

        <div id="adminPanel">

            <h2>👑 ADMIN ABUSE</h2>

            <div class="section">

                <label>Player</label>

                <select id="targetPlayer">
                    <option value="all">
                        Everyone
                    </option>
                </select>

            </div>


            <div class="section">

                <label>Cookies amount</label>

                <input
                    id="cookieAmount"
                    type="number"
                    value="1000"
                >

                <div class="adminButtons">

                    <button
                        onclick="giveCookies()"
                        class="success"
                    >
                        🍪 Give Cookies
                    </button>

                    <button onclick="setCookies()">
                        💰 Set Cookies
                    </button>

                </div>

            </div>


            <div class="section">

                <label>CPS</label>

                <input
                    id="cpsAmount"
                    type="number"
                    value="100"
                >

                <button
                    onclick="setCPS()"
                    style="width:100%;margin-top:8px"
                >
                    ⚡ Set CPS
                </button>

            </div>


            <div class="section">

                <input
                    id="broadcastMessage"
                    placeholder="Admin announcement..."
                >

                <button
                    onclick="broadcastMessage()"
                    style="width:100%;margin-top:8px"
                >
                    📢 Broadcast
                </button>

            </div>


            <div class="section">

                <div class="adminButtons">

                    <button onclick="resetPlayer()">
                        🔄 Reset
                    </button>

                    <button
                        onclick="kickPlayer()"
                        class="danger"
                    >
                        🚫 Kick
                    </button>

                </div>

                <button
                    onclick="nukeAll()"
                    class="danger"
                    style="width:100%;margin-top:8px"
                >
                    💥 NUKE EVERYONE
                </button>

            </div>


            <div class="section">

                <button
                    onclick="closeAdmin()"
                    class="close"
                    style="width:100%"
                >
                    CLOSE PANEL
                </button>

            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script>

let socket;
let myId = null;
let nickname = null;

let players = {};


// -----------------------------
// CONNECT
// -----------------------------

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        protocol + "//" + location.host
    );


    socket.onopen = () => {

        console.log("Connected to Cookie Empire");

        const saved =
            localStorage.getItem("cookieEmpireNickname");

        if (saved) {

            nickname = saved;

            send({
                type: "setNickname",
                nickname
            });

        }
    };


    socket.onmessage = event => {

        const data = JSON.parse(event.data);

        // -------------------------
        // CONNECTED
        // -------------------------

        if (data.type === "connected") {

            myId = data.id;

            if (nickname) {

                send({
                    type: "setNickname",
                    nickname
                });

            }

        }


        // -------------------------
        // NICKNAME
        // -------------------------

        if (data.type === "nicknameSet") {

            nickname = data.nickname;

            localStorage.setItem(
                "cookieEmpireNickname",
                nickname
            );

            document.getElementById(
                "playerName"
            ).textContent = nickname;

            document.getElementById(
                "nicknameScreen"
            ).style.display = "none";

        }


        // -------------------------
        // STATS
        // -------------------------

        if (data.type === "stats") {

            document.getElementById(
                "cookieCount"
            ).textContent =
                formatNumber(data.cookies) +
                " Cookies";

            document.getElementById(
                "cps"
            ).textContent =
                formatNumber(data.cps) +
                " CPS";
        }


        // -------------------------
        // PLAYER LIST
        // -------------------------

        if (data.type === "playerList") {

            players = {};

            data.players.forEach(p => {
                players[p.id] = p;
            });

            updatePlayerSelect();
        }


        if (data.type === "playerUpdated") {

            players[data.player.id] =
                data.player;

            updatePlayerSelect();
        }


        if (data.type === "playerLeft") {

            delete players[data.id];

            updatePlayerSelect();
        }


        // -------------------------
        // ADMIN LOGIN
        // -------------------------

        if (data.type === "adminLoginResult") {

            if (data.success) {

                document.getElementById(
                    "adminLogin"
                ).style.display = "none";

                document.getElementById(
                    "adminPanel"
                ).style.display = "block";

                showToast("👑 Admin access granted!");

            } else {

                showToast("❌ Wrong password!");

            }
        }


        // -------------------------
        // ADMIN MESSAGE
        // -------------------------

        if (data.type === "adminMessage") {

            showToast(
                "📢 " + data.message
            );
        }


        // -------------------------
        // KICK
        // -------------------------

        if (data.type === "kicked") {

            document.body.innerHTML = `
                <div style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    height:100vh;
                    background:#090909;
                    color:white;
                    text-align:center;
                    font-family:Arial;
                ">
                    <div>
                        <h1>🚫 You were kicked</h1>
                        <p>${escapeHTML(data.reason)}</p>
                    </div>
                </div>
            `;
        }

    };


    socket.onclose = () => {

        console.log("Disconnected");

        setTimeout(connect, 2000);
    };
}


// -----------------------------
// SEND
// -----------------------------

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {
        socket.send(JSON.stringify(data));
    }
}


// -----------------------------
// NICKNAME
// -----------------------------

function joinGame() {

    let name =
        document.getElementById(
            "nicknameInput"
        ).value.trim();

    if (!name) {

        showToast(
            "⚠️ Enter a nickname!"
        );

        return;
    }

    name = name
        .replace(/[<>]/g, "")
        .substring(0, 20);

    nickname = name;

    localStorage.setItem(
        "cookieEmpireNickname",
        name
    );

    send({
        type: "setNickname",
        nickname: name
    });
}


// -----------------------------
// COOKIE
// -----------------------------

document.getElementById(
    "cookie"
).addEventListener("click", () => {

    send({
        type: "click"
    });

});


// -----------------------------
// ADMIN
// -----------------------------

function openAdmin() {

    document.getElementById(
        "adminModal"
    ).style.display = "flex";
}


function closeAdmin() {

    document.getElementById(
        "adminModal"
    ).style.display = "none";
}


function adminLogin() {

    const password =
        document.getElementById(
            "adminPassword"
        ).value;

    send({
        type: "adminLogin",
        password
    });
}


// -----------------------------
// PLAYER SELECT
// -----------------------------

function updatePlayerSelect() {

    const select =
        document.getElementById(
            "targetPlayer"
        );

    select.innerHTML = `
        <option value="all">
            Everyone
        </option>
    `;

    Object.values(players).forEach(p => {

        if (p.id === myId) return;

        const option =
            document.createElement("option");

        option.value = p.id;

        option.textContent =
            p.nickname +
            " — " +
            formatNumber(p.cookies) +
            " cookies";

        select.appendChild(option);

    });
}


function getTarget() {

    return document.getElementById(
        "targetPlayer"
    ).value;
}


// -----------------------------
// GIVE COOKIES
// -----------------------------

function giveCookies() {

    send({
        type: "adminGiveCookies",
        target: getTarget(),
        amount:
            Number(
                document.getElementById(
                    "cookieAmount"
                ).value
            )
    });

    showToast("🍪 Cookies given!");
}


// -----------------------------
// SET COOKIES
// -----------------------------

function setCookies() {

    send({
        type: "adminSetCookies",
        target: getTarget(),
        amount:
            Number(
                document.getElementById(
                    "cookieAmount"
                ).value
            )
    });

    showToast("💰 Cookies changed!");
}


// -----------------------------
// SET CPS
// -----------------------------

function setCPS() {

    send({
        type: "adminSetCPS",
        target: getTarget(),
        cps:
            Number(
                document.getElementById(
                    "cpsAmount"
                ).value
            )
    });

    showToast("⚡ CPS changed!");
}


// -----------------------------
// RESET
// -----------------------------

function resetPlayer() {

    send({
        type: "adminReset",
        target: getTarget()
    });

    showToast("🔄 Player reset!");
}


// -----------------------------
// KICK
// -----------------------------

function kickPlayer() {

    const target = getTarget();

    if (target === "all") {

        showToast(
            "⚠️ Select a player first!"
        );

        return;
    }

    send({
        type: "adminKick",
        target,
        reason:
            "Kicked by Cookie Empire Admin."
    });
}


// -----------------------------
// NUKE
// -----------------------------

function nukeAll() {

    if (
        !confirm(
            "💥 NUKE EVERYONE?"
        )
    ) {
        return;
    }

    send({
        type: "adminNuke"
    });
}


// -----------------------------
// BROADCAST
// -----------------------------

function broadcastMessage() {

    const message =
        document.getElementById(
            "broadcastMessage"
        ).value.trim();

    if (!message) return;

    send({
        type: "adminBroadcast",
        message
    });

    document.getElementById(
        "broadcastMessage"
    ).value = "";
}


// -----------------------------
// UTILITIES
// -----------------------------

function formatNumber(num) {

    return Number(num).toLocaleString();
}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toast.style.display = "none";

        }, 2500);
}


// -----------------------------
// START
// -----------------------------

const saved =
    localStorage.getItem(
        "cookieEmpireNickname"
    );

if (saved) {

    nickname = saved;

    document.getElementById(
        "nicknameInput"
    ).value = saved;

} else {

    document.getElementById(
        "nicknameScreen"
    ).style.display = "flex";
}

connect();

</script>

</body>
</html>
